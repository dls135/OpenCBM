name: XUM1541 - Verificar compilador MSVC x64

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Localizar MSVC y SDK
        shell: pwsh
        run: |
          $log = "resultado-msvc.txt"
          "VERIFICACION MSVC X64" | Set-Content $log

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $instalaciones = & $vswhere -all -products '*' -property installationPath
            foreach ($instalacion in $instalaciones) {
              "Visual Studio: $instalacion" | Add-Content $log
              $vc = Join-Path $instalacion "VC\Tools\MSVC"
              if (Test-Path $vc) {
                Get-ChildItem $vc -Recurse -Filter cl.exe |
                  Select-Object -ExpandProperty FullName |
                  Add-Content $log
              }
              $devcmd = Join-Path $instalacion "Common7\Tools\VsDevCmd.bat"
              "VsDevCmd disponible: $(Test-Path $devcmd)" | Add-Content $log
            }
          }

          "WINDOWS SDK:" | Add-Content $log
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          if (Test-Path $sdk) {
            Get-ChildItem $sdk -Directory |
              Select-Object -ExpandProperty Name |
              Add-Content $log
          }

          Get-Content $log

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultado-msvc-x64
          path: resultado-msvc.txt
