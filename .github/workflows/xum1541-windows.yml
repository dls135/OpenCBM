
name: XUM1541 - Prueba compilacion C x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4

      - name: Comprobar compilacion MSVC x64
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (-not $vs) {
            throw 'No se encontro MSVC'
          }

          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'

          $includes = @(
            'xum1541',
            'opencbm\lib\plugin\xum1541',
            'opencbm\lib\plugin\xum1541\WINDOWS',
            'opencbm\libmisc\WINDOWS',
            'opencbm\include',
            'opencbm\include\WINDOWS',
            'opencbm\lib',
            'opencbm\lib\WINDOWS',
            'opencbm\arch\windows',
            'opencbm\libmisc'
          )

          $flags = ($includes | ForEach-Object { '/I"' + $_ + '"' }) -join ' '
          $source = 'opencbm\lib\plugin\xum1541\xum1541.c'
          $cmd = Join-Path $env:RUNNER_TEMP 'test-xum.cmd'

          @(
            '@echo off'
            ('call "' + $dev + '" -no_logo -arch=amd64')
            ('cl /nologo /Zs /DWIN32 /DHAVE_LIBUSB0=0 /DHAVE_LIBUSB1=1 /DHAVE_LIBUSB_1_0=1 ' + $flags + ' "' + $source + '"')
            'exit /b %errorlevel%'
          ) | Set-Content -Path $cmd -Encoding ascii

          & cmd.exe /d /c $cmd 2>&1 |
            Tee-Object -FilePath compilacion-xum1541.txt

          exit $LASTEXITCODE

      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-compilacion-xum1541
          path: compilacion-xum1541.txt
          if-no-files-found: warn
