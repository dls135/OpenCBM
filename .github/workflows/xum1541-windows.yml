name: XUM1541 Windows x64 - Diagnostico

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Obtener codigo OpenCBM
        uses: actions/checkout@v4

      - name: Examinar entorno de compilacion
        shell: pwsh
        run: |
          "Windows y herramientas:" | Out-File diagnostico.txt
          cmd /c ver | Out-File diagnostico.txt -Append
          foreach ($tool in @('cl.exe','nmake.exe','msbuild.exe','gcc.exe','make.exe')) {
            Get-Command $tool -ErrorAction SilentlyContinue |
              Select-Object Name,Source |
              Out-String | Out-File diagnostico.txt -Append
          }
          "Archivos de construccion OpenCBM:" | Out-File diagnostico.txt -Append
          Get-ChildItem -Recurse -File -Include sources,dirs,Makefile,makefile,*.sln,*.vcxproj,*.mk |
            Select-Object -ExpandProperty FullName |
            Out-File diagnostico.txt -Append
          Get-Content diagnostico.txt

      - name: Guardar informe
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-opencbm-windows
          path: diagnostico.txt
