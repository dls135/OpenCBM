
name: XUM1541 - Construir libmisc x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Obtener OpenCBM
        uses: actions/checkout@v4

      - name: Compilar libmisc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC no encontrado' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'

          New-Item -ItemType Directory -Force objetos-libmisc | Out-Null

          $base = 'opencbm\libmisc'
          $includes = @(
            "$base\WINDOWS",
            $base,
            'opencbm\include',
            'opencbm\include\WINDOWS',
            'opencbm\arch\windows',
            'xum1541'
          )
          $flags = ($includes | ForEach-Object { '/I"' + $_ + '"' }) -join ' '

          $sources = @(
            "$base\configuration.c",
            "$base\WINDOWS\dynlibusb.c",
            "$base\usbcommon0.c",
            "$base\WINDOWS\formaterrormessage.c",
            "$base\WINDOWS\getpluginaddress.c",
            "$base\WINDOWS\perfeval.c",
            "$base\WINDOWS\registry.c",
            "$base\statedebug.c",
            "$base\libstring.c"
          )

          $cmd = Join-Path $env:RUNNER_TEMP 'compilar-libmisc.cmd'
          $lines = @(
            '@echo off',
            ('call "' + $dev + '" -no_logo -arch=amd64'),
            'if errorlevel 1 exit /b 1'
          )

          foreach ($source in $sources) {
            $name = [IO.Path]::GetFileNameWithoutExtension($source)
            $out = "objetos-libmisc\$name.obj"
            $lines += ('cl /nologo /c /DWIN32 /DHAVE_LIBUSB0=0 /DHAVE_LIBUSB1=1 /DHAVE_LIBUSB_1_0=1 ' + $flags + ' /Fo"' + $out + '" "' + $source + '"')
            $lines += 'if errorlevel 1 exit /b 1'
          }

          $lines += 'lib /nologo /MACHINE:X64 /OUT:"libmisc.lib" objetos-libmisc\*.obj'
          $lines += 'if errorlevel 1 exit /b 1'
          $lines += 'exit /b 0'
          $lines | Set-Content $cmd -Encoding ascii

          & cmd.exe /d /c $cmd 2>&1 |
            Tee-Object -FilePath resultado-libmisc.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Compilacion fallida: $LASTEXITCODE"
          }

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libmisc-x64-experimental
          path: |
            resultado-libmisc.txt
            libmisc.lib
            objetos-libmisc/*.obj
          if-no-files-found: warn
